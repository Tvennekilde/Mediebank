name: Supabase keep-alive

on:
  schedule:
    - cron: "0 6 * * 1,4"   # mandag og torsdag kl. 06:00 UTC
  workflow_dispatch:         # gør det muligt at køre manuelt til test

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Forespørg databasen
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/medier?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
